<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080b11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="NSGY Call" />
    <meta
      name="description"
      content="Offline neurosurgery call decision support for rapid bedside use."
    />
    <title>NSGY Call 2.0</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="clinical-fields.css" />
    <link rel="stylesheet" href="communication-preview.css" />
    <link rel="stylesheet" href="reference-cleanup.css" />
    <link rel="stylesheet" href="fixed-scale.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button
          class="icon-button back-button"
          id="backButton"
          aria-label="Go back"
          hidden
        >
          ‹
        </button>
        <button class="brand" id="homeButton" aria-label="Go home">
          <span class="brand-mark">N</span
          ><span
            ><strong>NSGY Call</strong
            ><small>Clinical workflow · Offline</small></span
          >
        </button>
        <button class="icon-button" id="searchButton" aria-label="Search">
          ⌕
        </button>
        <button
          class="icon-button settings-button"
          id="contactsButton"
          aria-label="Contacts"
        >
          ⚙
        </button>
      </header>

      <main id="app" tabindex="-1"></main>

      <nav class="tabbar" aria-label="Primary navigation">
        <button data-route="home" class="active"><span>⌂</span>Home</button>
        <button data-route="search"><span>⌕</span>Search</button>
        <button data-route="favorites"><span>★</span>Favorites</button>
        <button data-route="recent"><span>◷</span>Recent</button>
      </nav>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="data.js"></script>
    <script src="wizard-data.js"></script>
    <script src="recommendations-data.js"></script>
    <script src="communication-data.js"></script>
    <script src="calculators/core.js"></script>
    <script src="calculators/gcs.js"></script>
    <script src="calculators/abc2.js"></script>
    <script src="calculators/ich.js"></script>
    <script src="calculators/hunt-hess.js"></script>
    <script src="calculators/modified-fisher.js"></script>
    <script src="calculators/tlics.js"></script>
    <script src="calculators/asia.js"></script>
    <script src="app.js"></script>
  </body>
</html>
